name: LVR platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-platforms:
    name: Core on ${{ matrix.os }} with Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run portable CLI tests
        shell: bash
        run: |
          if node --test tests/lvr/platform.test.mjs > platform-test.log 2>&1; then
            cat platform-test.log
          else
            cat platform-test.log
            node -e 'const log = require("node:fs").readFileSync("platform-test.log", "utf8"); const tail = log.slice(-4500).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A"); console.log(`::error title=Portable CLI tests::${tail}`)'
            exit 1
          fi
      - run: node scripts/sync-skills.mjs --check
